[project]
name = "cat-lendar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "line-bot-sdk>=3.22,<4",
    "google-api-python-client>=2.160,<3",
    "google-auth>=2.37,<3",
    "google-cloud-firestore>=2.19,<3",
    "pydantic-settings>=2.7,<3",
    "httpx>=0.28,<1",
    "google-genai>=2.25.0",
    "google-auth-httplib2>=0.2,<1",
    "httplib2>=0.22,<1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
]

[tool.ruff.lint]
# 明確釘住規則集。CI 用 `uvx ruff` 會抓最新版，若繼承 ruff 當週的預設值，
# 上游擴充預設規則就會讓沒動過的舊程式碼一夜變紅。
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
